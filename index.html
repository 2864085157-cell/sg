<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>时光代理人 · 定格</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07090d;color:#e9edf4;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.bgfx{position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(90% 60% at 50% -10%,rgba(90,150,180,.16),transparent 60%),radial-gradient(70% 50% at 110% 100%,rgba(200,120,70,.12),transparent 60%),linear-gradient(180deg,#06080c,#0b0f16 45%,#080a0e)}
.bgfx::after{content:"";position:absolute;inset:0;opacity:.045;background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
.screen{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;padding:14px 16px max(14px,env(safe-area-inset-bottom))}
.screen.lock{overflow:hidden}
.screen.flow{display:block;overflow-y:auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;font-family:inherit}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:linear-gradient(180deg,rgba(110,231,215,.14),rgba(110,231,215,.05));border:1px solid rgba(110,231,215,.32);color:#bff5ec;font-size:15px;letter-spacing:.08em;transition:transform .12s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#6ee7d7,#3fb9ad);color:#06231f;font-weight:700;border-color:transparent}
.btn.ghost{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1);color:#b9c6d4}
.btn:disabled{opacity:.45}

/* ---------- 标题 ---------- */
.title-wrap{margin:auto;text-align:center;width:100%;max-width:520px;padding:10px 0}
.brand{font-size:11px;letter-spacing:.62em;color:#7f93a8;text-indent:.62em}
.title{font-family:"Songti SC","Noto Serif SC",Georgia,serif;font-size:clamp(30px,9vw,42px);font-weight:700;letter-spacing:.14em;margin:16px 0 8px;background:linear-gradient(180deg,#ffffff,#8fa8bd 70%,#5d7389);-webkit-background-clip:text;background-clip:text;color:transparent;text-indent:.14em}
.subtitle{font-family:"Songti SC","Noto Serif SC",serif;color:#8aa0b4;letter-spacing:.28em;font-size:12.5px}
.title-photo{width:132px;height:165px;margin:26px auto 22px;border-radius:4px;background:linear-gradient(180deg,#1b2430,#0d131b);border:1px solid rgba(255,255,255,.09);position:relative;overflow:hidden;transform:rotate(-3deg);box-shadow:0 20px 40px -20px #000}
.title-photo::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:"Songti SC",serif;font-size:52px;color:rgba(160,200,220,.22)}
.title-photo::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 6px)}
.hint-line{font-size:11.5px;color:#6d7d8e;line-height:1.8;margin-top:16px}
.footnote{position:absolute;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));text-align:center;font-size:10.5px;color:#4d5a68;letter-spacing:.12em;z-index:1}

/* ---------- 剧情 ---------- */
.story{margin:0 auto;width:100%;max-width:520px;padding:6px 2px 4px}
.story .para{font-size:14.5px;line-height:2;color:#c8d4e0;margin-bottom:12px;opacity:0;animation:fadeUp .5s ease forwards}
.story .dlg{display:flex;margin-bottom:10px;opacity:0;animation:fadeUp .5s ease forwards}
.story .dlg .name{font-size:11px;color:#6d8296;width:52px;flex:0 0 52px;padding-top:6px;letter-spacing:.06em}
.story .dlg .txt{flex:1;font-size:14px;line-height:1.85;color:#dce6f0}
.story .dlg.lu .txt{color:#bfe6f5}
.story .dlg.cheng .txt{color:#ffd9b8}
.story .dlg.gu .txt{color:#d8d4e6}
.story .dlg.qiao .txt{color:#f0c8c8}

/* ---------- 照片 ---------- */
.ptop{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.1em;color:#7d8d9e;padding:0 2px 6px;flex:0 0 auto}
.ptop b{color:#a9d9d0;font-weight:600}
.stab{display:flex;align-items:center;gap:5px}
.stab em{font-style:normal;font-size:9.5px;letter-spacing:.16em;color:#5f6f80}
.stab i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.14);display:block}
.stab i.on{background:#6ee7d7;box-shadow:0 0 8px rgba(110,231,215,.7)}
.photo{position:relative;width:min(100%,44vh,400px);aspect-ratio:4/5;margin:0 auto 10px;flex:0 0 auto;border-radius:3px;overflow:hidden;background:#0c0f14;box-shadow:0 18px 40px -18px #000,0 0 0 1px rgba(255,255,255,.08),0 0 0 7px #efeae0,0 0 0 9px rgba(0,0,0,.55)}
.photo svg{position:absolute;inset:0;width:100%;height:100%;display:block;animation:sharpen 1.5s ease both}
.photo .develop{position:absolute;inset:0;background:#f7f3e9;pointer-events:none;animation:dev 1.3s ease forwards}
.photo .vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(75% 60% at 50% 45%,transparent 40%,rgba(0,0,0,.42) 100%)}
.photo .grain{position:absolute;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/></svg>")}
.hs{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;display:grid;place-items:center;border-radius:50%;padding:0}
.hs .ring{position:absolute;inset:-3px;border-radius:50%;border:1px solid rgba(110,231,215,.65);animation:pulse 2.4s infinite}
.hs .dot{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#08201d;background:rgba(110,231,215,.92);box-shadow:0 0 12px rgba(110,231,215,.55),0 0 0 1px rgba(0,0,0,.35);animation:pop .3s ease}
.hs.done .dot{background:rgba(240,246,250,.22);color:#cfe6ea;box-shadow:none;font-size:12px}
.hs.done .ring{display:none}
.hs.bad .dot{background:rgba(255,95,109,.92);color:#2b0007;box-shadow:0 0 12px rgba(255,95,109,.5)}
.hs.bad .ring{border-color:rgba(255,95,109,.7);animation-duration:1.3s}
.hs.done.bad .dot{background:rgba(255,95,109,.2);color:#ff99a3;box-shadow:none}

.cluebar{display:flex;gap:6px;flex-wrap:wrap;padding:0 2px 8px;flex:0 0 auto;min-height:24px}
.chip{font-size:10.5px;padding:3px 9px;border-radius:20px;background:rgba(110,231,215,.1);border:1px solid rgba(110,231,215,.25);color:#9fe8dd;animation:pop .3s ease}
.chip.empty{color:#5b6875;border-color:rgba(255,255,255,.07);background:none}

.chat{display:flex;flex-direction:column;gap:7px;overflow-y:auto;flex:1 1 auto;min-height:64px;padding:2px 2px 4px;scroll-behavior:smooth}
.msg{padding:8px 11px;border-radius:12px;font-size:13px;line-height:1.6;max-width:93%;animation:pop .25s ease}
.msg.lu{background:rgba(90,140,180,.13);border:1px solid rgba(120,180,220,.16);border-left:2px solid #6fc3e0;align-self:flex-start;color:#d3e4f1}
.msg.cheng{background:rgba(255,170,100,.09);border:1px solid rgba(255,170,100,.16);align-self:flex-end;color:#ffdfc2}
.msg.gu{background:rgba(160,160,190,.1);border:1px solid rgba(160,160,190,.14);align-self:flex-start;color:#d3d3e2}
.msg.qiao{background:rgba(230,140,140,.09);border:1px solid rgba(230,140,140,.14);align-self:flex-start;color:#f2cccc}
.msg.obs{background:rgba(255,255,255,.045);color:#c2ccd9;align-self:stretch;max-width:100%;border-left:2px solid rgba(255,255,255,.18);font-size:12.5px}
.msg.sys{align-self:center;font-size:11.5px;color:#8b9bad;background:none;padding:2px;text-align:center}
.msg.clue{align-self:center;font-size:11.5px;color:#07241f;background:linear-gradient(180deg,#8af0e2,#5fd6c8);border-radius:20px;padding:4px 13px;font-weight:700;letter-spacing:.04em}

.actions{display:flex;gap:10px;padding-top:8px;flex:0 0 auto}
.actions .btn{flex:1;padding:12px;font-size:14px}

/* ---------- 弹层 ---------- */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,5,8,.84);backdrop-filter:blur(7px);padding:0 12px max(12px,env(safe-area-inset-bottom));animation:fadeIn .2s ease}
.sheet{width:100%;max-width:520px;background:linear-gradient(180deg,#141c26,#0c1117);border:1px solid rgba(120,180,220,.16);border-radius:18px;padding:18px 16px 16px;max-height:84vh;overflow-y:auto;animation:up .26s cubic-bezier(.2,.9,.3,1)}
.sheet .kicker{font-size:10.5px;letter-spacing:.3em;color:#6d8296;margin-bottom:8px}
.sheet .q{font-family:"Songti SC","Noto Serif SC",serif;font-size:17px;line-height:1.7;color:#eaf2fa;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);color:#cddae7;font-size:13.5px;line-height:1.6;margin-bottom:9px;transition:background .15s,border-color .15s}
.opt:active{background:rgba(110,231,215,.1)}
.opt.dim{opacity:.34;text-decoration:line-through}
.opt.ok{border-color:rgba(110,231,215,.7);background:rgba(110,231,215,.14);color:#bff7ee}
.sheet .tip{font-size:11.5px;color:#7d8e9f;line-height:1.7;margin-top:4px}

/* ---------- 真相 ---------- */
.truth{margin:0 auto;width:100%;max-width:520px;padding:6px 0 10px}
.truth .kicker{font-size:10.5px;letter-spacing:.3em;color:#6d8296;margin-bottom:12px}
.truth .para{font-family:"Songti SC","Noto Serif SC",serif;font-size:15.5px;line-height:2.05;color:#dbe6f2;margin:0 0 13px;opacity:0;animation:fadeUp .6s ease forwards}
.truth .para.soft{color:#93a6b8;font-size:14px}

/* ---------- 结局 ---------- */
.finale{display:flex;flex-direction:column;gap:10px;margin:0 auto;width:100%;max-width:520px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.card{padding:11px 6px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);font-size:11.5px;line-height:1.5;color:#c3d0dd;text-align:center;min-height:62px;display:grid;place-items:center;transition:all .18s}
.card.on{background:rgba(110,231,215,.14);border-color:rgba(110,231,215,.65);color:#c9f7ef;box-shadow:0 0 16px -4px rgba(110,231,215,.5)}
.card.on::after{content:"✓";display:block;font-size:10px;color:#6ee7d7}

/* ---------- 动效 ---------- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(.86);opacity:.95}70%{transform:scale(1.45);opacity:0}100%{opacity:0}}
@keyframes dev{0%{opacity:1}55%{opacity:.5}100%{opacity:0}}
@keyframes sharpen{0%{filter:blur(7px) saturate(.35) brightness(1.25)}100%{filter:none}}
@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
body.shk #app{animation:shk .42s ease}
.fx{position:fixed;inset:0;pointer-events:none;z-index:99}
.fx.white{background:#fff;animation:fxw .55s ease-out forwards}
.fx.red{background:radial-gradient(circle at 50% 50%,rgba(255,60,80,.45),rgba(120,0,20,.35));animation:fxa .6s ease-out forwards}
@keyframes fxw{0%{opacity:.92}100%{opacity:0}}
@keyframes fxa{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.mute{position:absolute;top:10px;right:12px;z-index:5;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:14px;display:grid;place-items:center;opacity:.7}
</style>
</head>
<body>
<div id="app">
  <div class="bgfx"></div>
  <div id="screen" class="screen"></div>
</div>
<div id="fx" class="fx"></div>

<script>
/* ============================================================
   时光代理人 · 定格
   单文件 H5 剧情解谜游戏
   ============================================================ */

/* ---------------- 数据 ---------------- */

const CASES = [
  {
    no: '01',
    title: '正午的天台',
    place: '城南中学 · 教学楼天台',
    time: '12:07',
    meta: '监控截图 · 12:07:33',
    brief: [
      {w:'lu', t:'第一张。城南中学，教学楼天台，中午十二点零七分。'},
      {w:'lu', t:'这不是他拍的。是学校那台老监控的截图，被谁翻拍了下来。'},
      {w:'cheng', t:'所以画质才这么糊。'},
      {w:'lu', t:'糊一点好。太清楚的照片，会让人以为看见了全部。'},
      {w:'lu', t:'规矩再说一次：可以看，可以听，不能碰。'},
      {w:'lu', t:'红色的光点，别点。'},
      {w:'cheng', t:'知道了知道了，我又不是第一次。'},
      {w:'gu', t:'……他那天中午，去学校了。'}
    ],
    hints: [
      '别只盯着人。照片里最安静的东西，往往最响。',
      '地上、栏杆上、门缝里——有人待过的地方，就会留下痕迹。',

    hotspots: [
      {id:'a1', x:31, y:50.5, name:'汽水罐', clue:'两根吸管',
       text:'栏杆上放着一罐橘子汽水。罐身还挂着水珠，被太阳晒得发亮。罐口插着两根吸管，两根都被咬扁了。',

      {id:'a2', x:64, y:77.5, name:'校服外套', clue:'叠好的外套',
       text:'一件男式校服外套，叠得整整齐齐，压在台阶上，像在替谁占一个位置。袖口有两道洗不掉的蓝墨水。',
       after:'叠得这么规整。是准备还给谁，还是留给谁。'},
      {id:'a3', x:77, y:48, name:'楼梯间的门', clue:'门缝里的影子',
       text:'楼梯间的门只开了一条缝。缝里有一道很淡的影子，安安静静地站着，没有推门。',

      {id:'a4', x:44.5, y:70, name:'手腕', clue:'十二点零七分',
       text:'女孩手腕上的表反着光，指针停在十二点零七分。秒针卡在两个刻度之间，像被谁按住了。',
       after:'照片定住的时间。之后发生的事，没人拍下来。'},
      {id:'a5', x:37.5, y:66, name:'手机', clue:'没发出去的消息',
       text:'她手里攥着手机，屏幕亮着。输入框里有一行还没发出去的字：『你到了吗』。光标还在闪。',

      {id:'a6', x:20, y:83.5, name:'花坛', clue:'男生的鞋印',
       text:'花坛边有一朵被踩歪的蒲公英。旁边留着半个鞋印，尺码不小，是男生的鞋。',
       after:'脚印通到那扇门，没通向别处。'},
      {id:'ax', x:93, y:49, name:'门把手', bad:true,
       text:'你伸手去碰门把手——时间线猛地一颤，画面像被水泡过一样晃了一下。',
       after:'别动那扇门。它一辈子都没被推开过。你推开它，她就会回头；她一回头，这孩子的一辈子都会不一样。'}
    ],
    question: '十二点零七分，天台上有几个人？',
    options: [

      {t:'两个。另一个人站在门后，一直没有推门。', ok:true},
      {t:'三个。还有一个人在教学楼下面。', ok:false, fb:'楼下没有影子，也没有脚印通向楼下。'},

    truth: [
      '顾迟那天中午上了楼。',
      '他在楼梯间听见她在打电话，笑着说：「我在等人啊，他马上就到。」',

      '他想，如果她回头，我就出去。',
      '十二点零七分，她低头看了一眼手机。输入框里那行字，还是没发出去。',
      '十二点四十，他下楼，走了。那罐汽水一直放着，晒到温热。'
    ],
    tail: '她等的，从来不是别人。',
    after: [
      {k:'p', t:'照片消失的时候，顾晚的手一直在抖。'},
      {k:'gu', t:'……原来那天他不是一个人。'},
      {k:'gu', t:'我以为他一直都是一个人。'},
      {k:'lu', t:'第二张。这一张，是他自己拍的。'},
      {k:'cheng', t:'他拍的东西，可比监控清楚多了。'},
      {k:'lu', t:'清楚的照片更容易骗人。倒影里的东西，不一定在原地。'}

  {

    hints: [

      '小票、伞架、柜台上的东西——物件会替人记事。',
      '两瓶热的，一把借来的伞。他要照顾的人，就在他用眼睛够得到的地方。'
    ],
    hotspots: [
      {id:'b1', x:29, y:74, name:'两瓶牛奶', clue:'两瓶热牛奶',
       text:'柜台上并排放着两瓶热牛奶。标签都朝着镜头，摆得很正，像在等两个人来拿。瓶身还在冒白气。',
       after:'买了两瓶。可他一个人。'},
      {id:'b2', x:72, y:72, name:'小票', clue:'便利店的小票',
       text:'柜台边压着一张小票，被风吹起一角。上面印着：23:47，热牛奶 ×2，借伞 ×1。',

      {id:'b3', x:81, y:44, name:'玻璃上的字', clue:'玻璃上的字',

      {id:'b4', x:15, y:42, name:'雨里的人影', clue:'雨里的人影',

      {id:'b5', x:83, y:60, name:'伞架', clue:'空掉的伞架',
       text:'门口的伞架空了一格。地上有一圈干净的水痕，形状是一个人的双脚。他在这里停过。',

/* ---------------- 状态 ---------------- */

let S = {};
let AC = null;

function newGame(){
  S = {
    step: 0,
    phase: 'brief',
    ci: 0,
    found: {},
    clues: [],
    stability: 3,
    hints: [0, 0, 0],
    badClicks: 0,
    mute: false,
    picks: [],
    log: [],
    wrongOpts: [],
    modal: false,
    fail: false,
    finaleDone: false
  };
  try { S.mute = localStorage.getItem('llgc_mute') === '1'; } catch (e) {}
}

/* ---------------- 音效 ---------------- */

function ensureAC(){
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    return AC;
  } catch (e) { return null; }
}

function beep(f1, f2, dur, type, vol){
  if (S.mute) return;
  const a = ensureAC(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  const t = a.currentTime;
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
  g.gain.setValueAtTime(vol || 0.045, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.03);
}

function noise(dur, vol, hp){
  if (S.mute) return;
  const a = ensureAC(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 1400;
  const g = a.createGain(); g.gain.value = vol || 0.08;
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start();
}

function sfx(name){
  if (S.mute) return;
  switch (name) {
    case 'tap': beep(760, 620, 0.06, 'sine', 0.03); break;
    case 'clue': beep(880, 1320, 0.12, 'triangle', 0.05); break;
    case 'shutter': noise(0.09, 0.09, 2200); beep(1500, 400, 0.09, 'square', 0.03); break;
    case 'clap': noise(0.06, 0.12, 800); break;
    case 'glitch': beep(220, 60, 0.35, 'sawtooth', 0.06); noise(0.2, 0.05, 300); break;
    case 'chime': beep(660, 660, 0.5, 'sine', 0.04); setTimeout(function(){ beep(990, 990, 0.6, 'sine', 0.035); }, 120); break;
    case 'bad': beep(300, 120, 0.25, 'square', 0.05); break;
  }
}

/* ---------------- 流程 ---------------- */

const FLOW = [];
FLOW.push({type: 'title'});
FLOW.push({type: 'story', blocks: PROLOGUE, next: '继续'});
CASES.forEach(function(c, i){
  FLOW.push({type: 'case', i: i});
  if (c.after) FLOW.push({type: 'story', blocks: c.after, next: '继续'});
});
FLOW.push({type: 'finale'});
FLOW.push({type: 'ending'});

function startCase(i){
  S.ci = i;
  S.phase = 'brief';
  S.log = [];
  S.modal = false;
  S.fail = false;
  S.wrongOpts = [];
}

function go(n){
  S.step += (n || 1);
  const st = FLOW[S.step];
  if (st && st.type === 'case') startCase(st.i);
  render();
}

/* ---------------- 渲染 ---------------- */

const screenEl = function(){ return document.getElementById('screen'); };

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

const NAMES = { lu: '陆光', cheng: '程小时', gu: '顾晚', qiao: '乔苓' };

function chatHTML(){
  if (!S.log.length) return '<div class="msg sys">点击照片里的光点，看看那里有什么。</div>';
  return S.log.map(function(m){
    if (m.w === 'obs') return '<div class="msg obs">' + esc(m.t) + '</div>';
    if (m.w === 'sys') return '<div class="msg sys">' + esc(m.t) + '</div>';
    if (m.w === 'clue') return '<div class="msg clue">◇ ' + esc(m.t) + '</div>';
    return '<div class="msg ' + m.w + '">' + esc(m.t) + '</div>';
  }).join('');
}

function push(w, t){
  S.log.push({w: w, t: t});
  if (S.log.length > 40) S.log.shift();
}

function render(){
  const el = screenEl();
  const st = FLOW[S.step] || {type: 'ending'};
  let html = '', cls = 'screen';

  if (st.type === 'title') {
    html = titleHTML();
  } else if (st.type === 'story') {
    cls = 'screen flow';
    html = storyHTML(st);
  } else if (st.type === 'case') {
    cls = (S.phase === 'photo') ? 'screen lock' : 'screen flow';
    html = caseHTML(CASES[st.i]);
  } else if (st.type === 'finale') {
    cls = 'screen flow';
    html = finaleHTML();
  } else {
    cls = 'screen flow';
    html = endingHTML();
  }

  el.className = cls;
  el.innerHTML = html;
  el.scrollTop = 0;

  const chat = document.getElementById('chat');
  if (chat) chat.scrollTop = chat.scrollHeight;

  const muteBtn = document.getElementById('mutebtn');
  if (muteBtn) muteBtn.textContent = S.mute ? '🔇' : '🔊';
}

function titleHTML(){
  return '<button class="mute" id="mutebtn" data-act="mute">' + (S.mute ? '🔇' : '🔊') + '</button>'
    + '<div class="title-wrap">'
    + '<div class="brand">时光照相馆</div>'
    + '<div class="title">定格</div>'
    + '<div class="subtitle">无论过去，不问将来</div>'
    + '<div class="title-photo"></div>'
    + '<button class="btn primary" data-act="go">推开照相馆的门</button>'
    + '<div class="hint-line">三张照片，三个中午、深夜与黄昏。<br>点开照片里的光点，把那一格时间看清楚。<br>红色的光点是禁区——碰了，过去就会变。</div>'
    + '</div>'
    + '<div class="footnote">基于《时光代理人》二次创作 · 非官方同人小游戏</div>';
}

function storyHTML(st){
  const blocks = st.blocks.map(function(b, i){
    const d = (0.08 * i).toFixed(2) + 's';
    if (b.k === 'p') return '<div class="para" style="animation-delay:' + d + '">' + esc(b.t) + '</div>';
    return '<div class="dlg ' + b.k + '" style="animation-delay:' + d + '">'
      + '<div class="name">' + (NAMES[b.k] || '') + '</div>'
      + '<div class="txt">' + esc(b.t) + '</div></div>';
  }).join('');
  return '<div class="story">' + blocks + '</div>'
    + '<div style="flex:0 0 auto;margin-top:auto;padding-top:12px"><button class="btn primary" data-act="go">' + (st.next || '继续') + '</button></div>';
}

function caseHTML(C){
  if (S.phase === 'brief') return briefHTML(C);
  if (S.phase === 'truth') return truthHTML(C);
  return photoHTML(C);
}

function briefHTML(C){
  const msgs = C.brief.map(function(m){
    if (m.w === 'sys') return '<div class="msg sys">' + esc(m.t) + '</div>';
    return '<div class="msg ' + m.w + '">' + esc(m.t) + '</div>';
  }).join('');
  return '<div style="display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 10px">'
    + '<div style="font-size:10.5px;letter-spacing:.3em;color:#6d8296">第 ' + C.no + ' 张照片</div>'
    + '<div style="font-size:10.5px;color:#6d8296">' + esc(C.meta || '') + '</div></div>'
    + '<div style="font-family:\'Songti SC\',serif;font-size:26px;letter-spacing:.1em;color:#eaf2fa;padding:0 2px 4px">' + esc(C.title) + '</div>'
    + '<div style="font-size:11.5px;color:#7f93a8;padding:0 2px 14px">' + esc(C.place) + ' · ' + esc(C.time) + '</div>'
    + '<div class="chat" style="flex:1 1 auto">' + msgs + '</div>'
    + '<div style="flex:0 0 auto;margin-top:auto;padding-top:12px">'
    + '<button class="btn primary" data-act="clap">✋ 与陆光击掌，进入照片</button></div>';
}

function photoHTML(C){
  const clueList = S.clues.filter(function(c){ return c.c === S.ci; });
  const chips = clueList.length
    ? clueList.map(function(c){ return '<span class="chip">' + esc(c.name) + '</span>'; }).join('')
    : '<span class="chip empty">还没有线索</span>';

  let n = 0;
  const hs = C.hotspots.map(function(h){
    let label;
    if (h.bad) label = '!';
    else { n++; label = String(n); }
    const done = !!S.found[h.id];
    if (done && !h.bad) label = '✓';
    if (done && h.bad) label = '✕';
    return '<button class="hs ' + (h.bad ? 'bad ' : '') + (done ? 'done' : '') + '"'
      + ' style="left:' + h.x + '%;top:' + h.y + '%" data-act="hs" data-id="' + h.id + '"'
      + ' aria-label="' + esc(h.name) + '"><span class="ring"></span><span class="dot">' + label + '</span></button>';
  }).join('');

  let dots = '';
  for (let k = 0; k < 3; k++) dots += '<i class="' + (k < S.stability ? 'on' : '') + '"></i>';

  return '<div class="ptop"><span>第 <b>' + C.no + '</b> 张 · ' + esc(C.time) + '</span>'
    + '<span class="stab" title="时间线稳定度"><em>稳定度</em>' + dots + '</span></div>'
    + '<div class="photo">' + SCENES[S.ci] + '<div class="develop"></div><div class="vign"></div><div class="grain"></div>' + hs + '</div>'
    + '<div class="cluebar">' + chips + '</div>'
    + '<div class="chat" id="chat">' + chatHTML() + '</div>'
    + '<div class="actions">'
    + '<button class="btn ghost" data-act="hint">陆光，提示</button>'
    + '<button class="btn primary" data-act="deduce">推理</button>'
    + '</div>'
    + (S.modal ? modalHTML(C) : '')
    + (S.fail ? failHTML() : '');
}

function modalHTML(C){
  const opts = C.options.map(function(o, i){
    const dim = S.wrongOpts.indexOf(i) >= 0;
    return '<button class="opt ' + (dim ? 'dim' : '') + '" data-act="opt" data-i="' + i + '">'
      + String.fromCharCode(65 + i) + '．' + esc(o.t) + '</button>';
  }).join('');
  const own = C.hotspots.filter(function(h){ return !h.bad; });
  const all = own.filter(function(h){ return S.found[h.id]; }).length;
  return '<div class="modal"><div class="sheet">'
    + '<div class="kicker">推理 · 第 ' + C.no + ' 张</div>'
    + '<div class="q">' + esc(C.question) + '</div>'
    + opts
    + '<div class="tip">已看清 ' + all + ' / ' + own.length + ' 处 · 答错不扣时间，但陆光会记着</div>'
    + '<button class="btn ghost" data-act="closemodal" style="margin-top:8px">再回去看看</button>'
    + '</div></div>';
}

function failHTML(){

function truthHTML(C){
  const paras = C.truth.map(function(t, i){
    const d = (0.12 * i).toFixed(2) + 's';
    return '<div class="para" style="animation-delay:' + d + '">' + esc(t) + '</div>';

    + '<div class="kicker">真相 · 第 ' + C.no + ' 张</div>'

    + '<div class="para soft" style="animation-delay:' + (0.12 * C.truth.length).toFixed(2) + 's;margin-top:22px;border-top:1px solid rgba(255,255,255,.1);padding-top:16px">' + esc(C.tail || '') + '</div>'
    + '</div>'
    + '<div style="flex:0 0 auto;margin-top:auto;padding-top:10px"><button class="btn primary" data-act="go">合上这张照片</button></div>';

function finaleHTML(){
  const cards = FINALE_CARDS.map(function(c){
    const on = S.picks.indexOf(c.id) >= 0;
    return '<button class="card ' + (on ? 'on' : '') + '" data-act="pick" data-id="' + c.id + '">' + esc(c.name) + '</button>';
  }).join('');

  let body = '';
  if (S.finaleDone) {
    const lines = S.picks.map(function(id){ return FINALE_LINES[id] || ''; });
    body = '<div class="truth" style="margin-top:0">'
      + lines.map(function(t, i){
          return '<div class="para" style="animation-delay:' + (0.3 * i).toFixed(2) + 's">' + esc(t) + '</div>';
        }).join('')
      + '<div class="para" style="animation-delay:1.1s;color:#a9d9d0">「所以那天晚上，他不是一个人回家的。」</div>'
      + '<div class="para" style="animation-delay:1.4s;color:#a9d9d0">「他有一把伞，两瓶牛奶，和一整面墙的人在看着他笑。」</div>'
      + '</div>'
      + '<button class="btn primary" data-act="go" style="margin-top:18px">把答案交给她</button>';
  } else {
    body = '<div class="q" style="font-family:\'Songti SC\',serif;font-size:17px;line-height:1.8;color:#eaf2fa;margin:4px 0 6px">'

      + '<div class="tip" style="font-size:12px;color:#8b9bad;line-height:1.8">从三张照片里，挑出三样能回答她的东西。<br>不多不少，三样。</div>'
      + '<div class="cards">' + cards + '</div>'
      + '<button class="btn primary" data-act="submitPicks">' + (S.picks.length === 3 ? '把这三样放在她面前' : '还差 ' + (3 - S.picks.length) + ' 样') + '</button>';

  return '<div style="font-size:10.5px;letter-spacing:.3em;color:#6d8296;padding:6px 2px 10px">终章 · 拼出答案</div>'
    + '<div class="finale">' + body + '</div>';
}

    + '<div style="display:flex;justify-content:space-between;font-size:12.5px;color:#c4d2e0;line-height:2">'
    + '<span>触碰禁区</span><span>' + S.badClicks + ' 次' + (S.badClicks === 0 ? '（手很稳）' : '') + '</span></div>'
    + '<div style="display:flex;justify-content:space-between;font-size:12.5px;color:#c4d2e0;line-height:2">'
    + '<span>照片</span><span>3 / 3</span></div>'
    + '</div>'
    + '<button class="btn ghost" data-act="restart" style="margin-top:20px">再走一遍这三张照片</button>'
    + '</div>';
}

/* ---------------- 交互 ---------------- */

function flash(kind){
  const fx = document.getElementById('fx');
  fx.className = 'fx ' + kind;
  setTimeout(function(){ fx.className = 'fx'; }, 620);
}

function shake(){
  document.body.classList.remove('shk');
  void document.body.offsetWidth;
  document.body.classList.add('shk');
  setTimeout(function(){ document.body.classList.remove('shk'); }, 460);
}

function onHotspot(id){
  const C = CASES[S.ci];
  const h = C.hotspots.filter(function(x){ return x.id === id; })[0];
  if (!h) return;

  if (h.bad) {
    const again = !!S.found[id];
    S.found[id] = true;
    S.badClicks++;
    S.stability--;
    sfx('glitch');
    flash('red');
    shake();
    push('obs', again ? '你又把手伸向了那里。画面抖得很厉害，像一张被水泡过的相纸。' : h.text);
    push('lu', h.after);
    if (S.stability <= 0) {
      S.stability = 3;
      S.fail = true;
    }
    render();
    return;
  }

  if (S.found[id]) {
    push('sys', '这里已经看过了。');
    sfx('tap');
    render();
    return;
  }

  S.found[id] = true;

  sfx('clue');
  push('obs', h.text);
  if (h.after) push('lu', h.after);
  S.clues.push({name: h.clue, c: S.ci});
  push('clue', '线索：' + h.clue);
  const ownAll = C.hotspots.filter(function(x){ return !x.bad; });
  if (ownAll.every(function(x){ return S.found[x.id]; })) {
    push('sys', '线索齐了。可以推理了。');
  }
  render();
}

function openModal(){
  const C = CASES[S.ci];
  const own = C.hotspots.filter(function(h){ return !h.bad; });
  const got = own.filter(function(h){ return S.found[h.id]; }).length;
  if (got < own.length) {
    sfx('bad');
    push('sys', '照片里还有 ' + (own.length - got) + ' 处没看清。');
    push('lu', '再看一眼。别急着下结论。');
    render();
    return;
  }
  sfx('tap');
  S.modal = true;
  render();
}

function chooseOpt(i){
  const C = CASES[S.ci];
  const o = C.options[i];
  if (!o || S.wrongOpts.indexOf(i) >= 0) return;

  if (o.ok) {
    sfx('chime');
    S.modal = false;
    S.phase = 'truth';
    render();
    return;
  }

  sfx('bad');
  shake();
  S.wrongOpts.push(i);
  if (o.fb) push('lu', o.fb);
  else push('lu', '不是这个。');
  render();
}

function hint(){
  const C = CASES[S.ci];
  const n = S.hints[S.ci] || 0;
  if (n >= C.hints.length) {
    push('lu', '该说的我都说完了。剩下的，你得自己看。');
  } else {
    push('lu', C.hints[n]);
    S.hints[S.ci] = n + 1;
  }
  sfx('tap');
  render();
}

function clap(){
  sfx('clap');
  flash('white');
  setTimeout(function(){
    sfx('shutter');
    S.phase = 'photo';
    S.log = [];
    push('lu', '进去以后，别乱动。');
    push('cheng', '知道了。');
    render();
  }, 420);
}

function pick(id){
  const i = S.picks.indexOf(id);
  if (i >= 0) { S.picks.splice(i, 1); }
  else {
    if (S.picks.length >= 3) { push('sys', '只能选三样。'); render(); return; }
    S.picks.push(id);
  }
  sfx('tap');
  render();
}

function submitPicks(){
  if (S.picks.length !== 3) return;
  const wrong = S.picks.filter(function(id){
    const c = FINALE_CARDS.filter(function(x){ return x.id === id; })[0];
    return !c || !c.ok;
  });
  if (wrong.length) {
    sfx('bad');
    shake();
    push('lu', '再想想。这三样里，有一样是别人的故事。');
    S.picks = [];
    render();
    return;
  }
  // 顺序无所谓，但按 a3 -> b1 -> c1 排好
  const order = ['a3', 'b1', 'c1'];
  S.picks = order.filter(function(id){ return S.picks.indexOf(id) >= 0; });
  S.finaleDone = true;
  sfx('chime');
  render();
}

/* ---------------- 事件 ---------------- */

document.addEventListener('click', function(e){
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.getAttribute('data-act');
  ensureAC();

  switch (act) {
    case 'go': go(1); break;
    case 'clap': clap(); break;
    case 'hs': onHotspot(t.getAttribute('data-id')); break;
    case 'hint': hint(); break;
    case 'deduce': openModal(); break;
    case 'opt': chooseOpt(parseInt(t.getAttribute('data-i'), 10)); break;
    case 'closemodal': S.modal = false; render(); break;
    case 'retry': {
      const C = CASES[S.ci];
      C.hotspots.forEach(function(h){ delete S.found[h.id]; });
      S.clues = S.clues.filter(function(c){ return c.c !== S.ci; });
      S.log = [];
      S.stability = 3;
      S.fail = false;
      S.modal = false;
      S.wrongOpts = [];
      push('lu', '记住：红色的，别碰。');
      render();
      break;
    }
    case 'pick': pick(t.getAttribute('data-id')); break;
    case 'submitPicks': submitPicks(); break;
    case 'mute': {
      S.mute = !S.mute;
      try { localStorage.setItem('llgc_mute', S.mute ? '1' : '0'); } catch (err) {}
      render();
      break;
    }
    case 'restart': newGame(); render(); break;
  }
});

/* ---------------- 启动 ---------------- */

newGame();
render();
</script>

</html>
